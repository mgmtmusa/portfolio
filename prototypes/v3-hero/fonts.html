<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><title>Display face comparison</title>
<style>
@font-face{font-family:Host;src:url(fonts/host-grotesk-latin-wght-normal.woff2) format('woff2');font-weight:300 800}
@font-face{font-family:Schibsted;src:url(fonts/schibsted-grotesk-latin-wght-normal.woff2) format('woff2');font-weight:400 900}
@font-face{font-family:Funnel;src:url(fonts/funnel-display-latin-wght-normal.woff2) format('woff2');font-weight:300 800}
@font-face{font-family:Geist;src:url(fonts/geist-latin-wght-normal.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:GeistMono;src:url(fonts/geist-mono-latin-wght-normal.woff2) format('woff2');font-weight:100 900}
body{margin:0;background:#121110;color:#F3F1EC;font-family:Geist;padding:40px 56px}
section{border-top:1px solid rgb(255 255 255/.08);padding:22px 0 30px}
.lab{font:500 12px/1 GeistMono;letter-spacing:.08em;text-transform:uppercase;color:#A3A19B;margin-bottom:14px}
.m{font-size:200px;line-height:.86;letter-spacing:-.045em;white-space:nowrap}
.n{font-size:120px;line-height:.9;letter-spacing:-.04em;margin-top:18px;color:#F3F1EC}
.n sup{font:500 18px GeistMono;color:#D8C69E;vertical-align:top;margin-left:4px;letter-spacing:0}
</style></head><body>
<section><div class="lab">Host Grotesk 560</div><div class="m" style="font-family:Host;font-weight:560">Musa Abdullah</div><div class="n" style="font-family:Host;font-weight:500">28% 65% $2M+ 13,200<sup>1</sup></div></section>
<section><div class="lab">Schibsted Grotesk 600</div><div class="m" style="font-family:Schibsted;font-weight:600">Musa Abdullah</div><div class="n" style="font-family:Schibsted;font-weight:520">28% 65% $2M+ 13,200<sup>1</sup></div></section>
<section><div class="lab">Funnel Display 500</div><div class="m" style="font-family:Funnel;font-weight:500">Musa Abdullah</div><div class="n" style="font-family:Funnel;font-weight:460">28% 65% $2M+ 13,200<sup>1</sup></div></section>
<section><div class="lab">Geist 560 (display only if it wins)</div><div class="m" style="font-family:Geist;font-weight:560">Musa Abdullah</div><div class="n" style="font-family:Geist;font-weight:500">28% 65% $2M+ 13,200<sup>1</sup></div></section>
</body></html>
